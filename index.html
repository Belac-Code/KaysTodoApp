<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App with Secured Admin Panel</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    input, button { margin: 5px 0; padding: 10px; width: 100%; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .btn-danger { background: #dc3545; width: auto; padding: 5px 10px; margin-left: 10px; }
    .admin-card { background: #fdf2f2; border-left: 5px solid #dc3545; }
    .user-box { background: white; border: 1px solid #ddd; padding: 12px; margin: 10px 0; border-radius: 6px; }
    .active-tag { color: green; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Simple Todo & Admin System</h1>

  <!-- 1. USER AUTH -->
  <div class="card" id="userAuthSection">
    <h2>User Access (Sign Up / Login)</h2>
    <input type="text" id="name" placeholder="Full Name (for signup)">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="handleSignup()">Sign Up</button>
    <button onclick="handleLogin()" style="background:#6c757d;">Login</button>
  </div>

  <!-- 2. USER TODO APP -->
  <div class="card" id="todoSection" style="display:none;">
    <h2>Welcome, <span id="userName"></span>!</h2>
    <input type="text" id="todoInput" placeholder="Enter a task...">
    <button onclick="addTodo()">Add Task</button>
    <ul id="todoList"></ul>
  </div>

  <hr>

  <!-- 3. ADMIN PANEL -->
  <div class="card admin-card">
    <h2>Admin Dashboard</h2>
    
    <!-- Admin Login Sub-Form -->
    <div id="adminLoginForm">
      <p><strong>Default Admin Logins:</strong> admin@app.com / admin123</p>
      <input type="email" id="adminEmail" placeholder="Admin Email">
      <input type="password" id="adminPassword" placeholder="Admin Password">
      <button onclick="handleAdminLogin()" style="background: #28a745;">Login as Admin</button>
    </div>

    <!-- Admin Content Area (Hidden until logged in) -->
    <div id="adminContent" style="display:none;">
      <p style="color:green;">✔ Admin Authenticated</p>
      <button onclick="fetchAdminData()" style="background: #17a2b8;">Refresh User List</button>
      <div id="adminUserList"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://kaystodoapp.onrender.com/api';
    let currentUser = null;
    let isAdminLoggedIn = false;

    // --- STANDARD USER LOGIC ---
    async function handleSignup() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const res = await fetch(`${API_URL}/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      const data = await res.json();
      if (data.error) return alert(data.error);

      alert(data.message);
      currentUser = data.user;
      showTodoApp();
    }

    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const res = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (data.error) return alert(data.error);

      alert(data.message);
      currentUser = data.user;
      showTodoApp();
    }

    async function addTodo() {
      const text = document.getElementById('todoInput').value;

      const res = await fetch(`${API_URL}/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, text })
      });

      const data = await res.json();
      renderTodos(data.todos);
      document.getElementById('todoInput').value = '';
    }

    function showTodoApp() {
      document.getElementById('userAuthSection').style.display = 'none';
      document.getElementById('todoSection').style.display = 'block';
      document.getElementById('userName').innerText = currentUser.name;
      renderTodos(currentUser.todos || []);
    }

    function renderTodos(todos) {
      const ul = document.getElementById('todoList');
      ul.innerHTML = todos.map(t => `<li>${t.text}</li>`).join('');
    }

    // --- ADMIN LOGIC ---

    // 1. Admin Login
    async function handleAdminLogin() {
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;

      const res = await fetch(`${API_URL}/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (data.error) return alert(data.error);

      isAdminLoggedIn = true;
      document.getElementById('adminLoginForm').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      
      // Auto fetch users upon login
      fetchAdminData();
    }

    // 2. Fetch All Users
    async function fetchAdminData() {
      const res = await fetch(`${API_URL}/admin/users`, {
        headers: { 'x-is-admin': 'true' } // Custom header passing admin check
      });
      const users = await res.json();

      renderAdminUsers(users);
    }

    // 3. Delete User from Back End
    async function deleteUser(userId) {
      if (!confirm('Are you sure you want to delete this user?')) return;

      // Notice HTTP Method is 'DELETE'
      const res = await fetch(`${API_URL}/admin/users/${userId}`, {
        method: 'DELETE',
        headers: { 'x-is-admin': 'true' }
      });

      const data = await res.json();
      alert(data.message);

      // Re-render user list with updated data from server
      renderAdminUsers(data.users);
    }

    // Helper function to draw user cards in Admin panel
    function renderAdminUsers(users) {
      const container = document.getElementById('adminUserList');
      
      if (users.length === 0) {
        container.innerHTML = '<p>No users found on the system.</p>';
        return;
      }

      container.innerHTML = users.map(user => `
        <div class="user-box">
          <strong>ID:</strong> ${user.id} <br>
          <strong>Name:</strong> ${user.name} <br>
          <strong>Email:</strong> ${user.email} <br>
          <strong>Password:</strong> <code>${user.password}</code> <br>
          <strong>Status:</strong> <span class="active-tag">${user.isActive ? 'Active' : 'Inactive'}</span> <br>
          <strong>Total Todos:</strong> ${user.todos.length}
          <br><br>
          <button class="btn-danger" onclick="deleteUser(${user.id})">Delete User</button>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
