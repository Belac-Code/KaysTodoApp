<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Todo & Admin System</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { max-width: 600px; margin: 30px auto; padding: 0 15px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    .btn-primary { background: #007bff; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-danger { background: #dc3545; color: white; width: auto; padding: 5px 10px; margin: 0; }
    ul { list-style: none; padding: 0; }
    li { background: #f8f9fa; padding: 10px; border: 1px solid #eee; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
    .badge { background: #17a2b8; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
  </style>
</head>
<body>

  <h2>Simple Todo & Admin System</h2>

  <!-- UNIFIED LOGIN / SIGNUP FORM -->
  <div class="card" id="authCard">
    <h3>Account Access</h3>
    <input type="text" id="nameInput" placeholder="Full Name (for signup only)" />
    <input type="email" id="emailInput" placeholder="Email" />
    <input type="password" id="passwordInput" placeholder="Password" />

    <button onclick="handleSignUp()" class="btn-primary">Sign Up</button>
    <button onclick="handleLogin()" class="btn-secondary">Login</button>
  </div>

  <!-- USER DASHBOARD -->
  <div class="card" id="userDashboard" style="display: none;">
    <h3>Welcome, <span id="userNameDisplay"></span>!</h3>
    <input type="text" id="todoInput" placeholder="Enter a new todo..." />
    <button onclick="addTodo()" class="btn-primary">Add Todo</button>

    <h4>Your Todos:</h4>
    <ul id="todoList"></ul>
    <button onclick="logout()" class="btn-secondary">Logout</button>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div class="card" id="adminDashboard" style="display: none;">
    <h3>Admin Control Panel <span class="badge">Admin</span></h3>
    <p>Manage active users and system data below:</p>
    
    <h4>Registered Users:</h4>
    <ul id="userList"></ul>

    <button onclick="logout()" class="btn-secondary">Logout</button>
  </div>

  <script>
    const API_URL = '/api';
    let currentUser = null;

    // LOGIN FUNCTION (Unified)
    async function handleLogin() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) return alert(data.error);

        document.getElementById('authCard').style.display = 'none';

        if (data.isAdmin) {
          document.getElementById('adminDashboard').style.display = 'block';
          loadAdminUsers();
        } else {
          currentUser = data.user;
          document.getElementById('userNameDisplay').textContent = currentUser.name;
          document.getElementById('userDashboard').style.display = 'block';
          renderTodos(currentUser.todos);
        }
      } catch (err) {
        alert('Could not connect to server.');
      }
    }

    // SIGNUP FUNCTION
    async function handleSignUp() {
      const name = document.getElementById('nameInput').value;
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      if (!name || !email || !password) return alert('Please fill in all fields.');

      try {
        const res = await fetch(`${API_URL}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        if (!res.ok) return alert(data.error);

        alert('Account created! Logging you in...');
        currentUser = data.user;
        document.getElementById('authCard').style.display = 'none';
        document.getElementById('userNameDisplay').textContent = currentUser.name;
        document.getElementById('userDashboard').style.display = 'block';
        renderTodos([]);
      } catch (err) {
        alert('Could not connect to server.');
      }
    }

    // USER TODO FUNCTIONS
    async function addTodo() {
      const text = document.getElementById('todoInput').value;
      if (!text) return;

      const res = await fetch(`${API_URL}/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, text })
      });

      const data = await res.json();
      if (res.ok) {
        document.getElementById('todoInput').value = '';
        renderTodos(data.todos);
      }
    }

    function renderTodos(todos) {
      const list = document.getElementById('todoList');
      list.innerHTML = todos.map(t => `<li>${t.text}</li>`).join('');
    }

    // ADMIN FUNCTIONS
    async function loadAdminUsers() {
      const res = await fetch(`${API_URL}/admin/users`, {
        headers: { 'x-is-admin': 'true' }
      });
      const users = await res.json();

      const list = document.getElementById('userList');
      if (users.length === 0) {
        list.innerHTML = '<li>No users registered yet.</li>';
        return;
      }

      list.innerHTML = users.map(u => `
        <li>
          <div>
            <strong>${u.name}</strong> (${u.email}) - ${u.todos.length} todos
          </div>
          <button onclick="deleteUser(${u.id})" class="btn-danger">Delete</button>
        </li>
      `).join('');
    }

    async function deleteUser(id) {
      if (!confirm('Are you sure you want to delete this user?')) return;

      const res = await fetch(`${API_URL}/admin/users/${id}`, {
        method: 'DELETE',
        headers: { 'x-is-admin': 'true' }
      });

      if (res.ok) loadAdminUsers();
    }

    function logout() {
      currentUser = null;
      document.getElementById('userDashboard').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'none';
      document.getElementById('authCard').style.display = 'block';
      document.getElementById('emailInput').value = '';
      document.getElementById('passwordInput').value = '';
      document.getElementById('nameInput').value = '';
    }
  </script>
</body>
</html>
